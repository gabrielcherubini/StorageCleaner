# XcodeGen spec for StorageCleaner. After editing, regenerate the committed project with:
#   xcodegen generate
name: StorageCleaner
options:
  bundleIdPrefix: com.gabrielcherubini
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  StorageCleanerCore:
    path: StorageCleanerCore

targets:
  StorageCleaner:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: StorageCleaner
        excludes:
          - "*.entitlements"
    dependencies:
      - package: StorageCleanerCore
    preBuildScripts:
      - name: Safety guard (no permanent deletion)
        script: '"${SRCROOT}/scripts/check-no-permanent-delete.sh" "${SRCROOT}"'
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gabrielcherubini.StorageCleaner
        PRODUCT_NAME: StorageCleaner
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: StorageCleaner
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "StorageCleaner scans your photo library to find large, duplicate and throwaway media. Nothing is removed unless you confirm, and removed items go to Recently Deleted."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        CODE_SIGN_IDENTITY: "Apple Development"
        "CODE_SIGN_IDENTITY[sdk=macosx*]": "-"
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": StorageCleaner/StorageCleaner.entitlements
        "LD_RUNPATH_SEARCH_PATHS[sdk=macosx*]": "$(inherited) @executable_path/../Frameworks"
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        Release:
          "ENABLE_HARDENED_RUNTIME[sdk=macosx*]": YES
    scheme:
      testTargets:
        - StorageCleanerTests
      gatherCoverageData: true

  StorageCleanerTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - path: StorageCleanerTests
    dependencies:
      - target: StorageCleaner
      - package: StorageCleanerCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gabrielcherubini.StorageCleanerTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/StorageCleaner.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/StorageCleaner"
        "LD_RUNPATH_SEARCH_PATHS[sdk=macosx*]": "$(inherited) @executable_path/../Frameworks @loader_path/../Frameworks"
